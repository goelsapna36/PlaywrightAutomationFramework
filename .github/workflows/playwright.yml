name: Playwright CI

on:
  push:
    branches:
      - main
      - Master
      - sapna1

  pull_request:
    branches:
      - main
      - Master

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run all Playwright tests
        id: playwright
        continue-on-error: true
        run: npx playwright test

      - name: Comment test result on Jira
        if: always()
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          node -e "
          const axios = require('axios');

          const passed = '${{ steps.playwright.outcome }}' === 'success';

          const message = passed
            ? '✅ Playwright CI tests passed successfully.'
            : '❌ Playwright CI tests failed. Check the GitHub Actions Playwright report.';

          axios.post(
            'https://' + process.env.JIRA_DOMAIN + '/rest/api/3/issue/KAN-1/comment',
            {
              body: {
                type: 'doc',
                version: 1,
                content: [{
                  type: 'paragraph',
                  content: [{
                    type: 'text',
                    text: message
                  }]
                }]
              }
            },
            {
              auth: {
                username: process.env.JIRA_EMAIL,
                password: process.env.JIRA_TOKEN
              },
              headers: {
                'Content-Type': 'application/json'
              }
            }
          )
          .then(() => console.log('✅ Jira comment created'))
          .catch(error => {
            console.error('❌ Jira comment failed');
            console.error(error.response?.data || error.message);
            process.exit(1);
          });
          "

      - name: Fail workflow if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30